# /etc/homelab/borgbackup/config.yml
#
# Installed with mode 600, owned by root:root (may contain a plaintext
# encryption passphrase). Copied here from config.example.yml by install.sh
# on first install; install.sh will not overwrite an existing config.yml.

# --- Identity -----------------------------------------------------------
# Optional override for the host identifier used in the repo path on
# borgbackup_server. Leave blank to auto-derive:
#   "<system-hostname>-<contents of /etc/machine-id>"
# If /etc/machine-id can't be read and this is blank, the script logs to
# journald and exits cleanly (exit 0) rather than backing up under an
# unstable/ambiguous identifier.
hostname: ""

# --- Backup server --------------------------------------------------------
# Address (hostname or IP) of the centralized backup server. Required.
borgbackup_server: ""

# SSH user on borgbackup_server. Defaults to "borgbackup" if unset/blank.
ssh_borgbackup_server_username: borgbackup

# Base directory on borgbackup_server under which this host's own repo
# lives (repo path becomes <this>/<identifier>). Defaults to /var/borgbackup
# if unset/blank. Must match the backup_location configured on the
# homelab-borg-service-backup-server package (see its config.yml) --
# e.g. borgbackup01 overrides this to /mnt/borgbackup to match its
# already-populated repos predating the /var/borgbackup default.
borgbackup_server_backup_location: /var/borgbackup

# --- Encryption ------------------------------------------------------------
# A random per-host passphrase is generated by install.sh on first
# install (repos use borg's `repokey` encryption). Keep this file mode
# 600 root:root — this passphrase is the only thing standing between an
# attacker and every config/secret this host backs up.
#
# Once a repo is created, a `borg key export` (plus a `--paper` copy) is
# written to /etc/homelab/borgbackup/key-escrow/ as a second safety net
# independent of this passphrase. Neither the passphrase nor the key
# export is replicated anywhere off this host automatically — copy both
# to a password manager/secrets vault AND an offline/paper copy. See the
# README's Disaster Recovery section.
#
# Leaving passphrase blank is a hard error unless allow_unencrypted is
# explicitly set to true — an unencrypted backup on a shared server can
# expose every secret in /etc/homelab/*, so this should not be used
# outside of disposable test environments.
encryption:
  passphrase: ""
  allow_unencrypted: false

# --- Backup mode -------------------------------------------------------
# One of: full_host | local_only | homelab_only | specific
#
#   full_host    - everything on the host that can be backed up (source "/",
#                  excluding only pseudo-filesystems: /proc /sys /dev /run /tmp)
#   local_only   - same as full_host, but also excludes any mount point whose
#                  filesystem type is a network/virtual fs (nfs, cifs, sshfs,
#                  overlay, tmpfs, etc.) as reported by /proc/mounts
#   homelab_only - back up only what's listed under homelab_only: below
#                  (application configs + database dumps). Does NOT include
#                  end-user data (Drive files, mailboxes, etc.)
#   specific     - back up only what's listed under specific.paths: below
mode: full_host

specific:
  # Literal paths, or Borg pattern syntax (fm:/sh:/re: prefixes), used only
  # when mode: specific.
  paths: []

homelab_only:
  # Config directories/files for installed homelab-* services. install.sh
  # pre-populates this by checking which homelab-* packages are installed;
  # edit freely.
  paths: []
  # Databases to pg_dump into a staging directory before each backup, then
  # include that directory as a backup source. The staging directory is
  # cleaned up after the backup completes.
  databases: []
  #  - type: postgres
  #    name: mailserver
  #    dump_dir: /var/lib/homelab-borg-service-backup-client/dumps

# Regex patterns (Python re syntax) excluded in ALL modes, translated to
# Borg "re:" pattern lines and applied on top of whatever the mode above
# already selects.
exclude: []
#  - '.*\.cache/.*'
#  - '/var/tmp/.*'

# --- Schedule ------------------------------------------------------------
# mode: hourly | daily | weekly | monthly | calendar | continuous
#
#   hourly     - maps directly to a systemd OnCalendar=hourly timer.
#   daily/weekly/monthly - fire once a day/week/month at a randomized
#                time of night rather than exactly at midnight, so a
#                whole fleet backing up to the same borgbackup_server
#                doesn't all connect at once. install.sh picks a random
#                hour (from window_hours below) and minute (0-59) ONCE
#                and persists it into start_hour/start_minute below;
#                re-running install.sh keeps reusing that same time
#                unless you clear both fields to force a re-roll.
#   calendar   - use `calendar:` below verbatim as a systemd OnCalendar=
#                expression (see `man systemd.time`), for crontab-like
#                schedules that don't fit the presets above. Not
#                randomized — you're specifying the exact time yourself.
#   continuous - no timer; a long-running service runs a backup, and as
#                soon as it completes, immediately starts the next one.
schedule:
  mode: daily
  calendar: ""

  # Candidate hours (24h, local time) for the randomized daily/weekly/
  # monthly start time. Default is an 11pm-3am window (23, 0, 1, 2 —
  # i.e. up to but not including 3am).
  window_hours: [23, 0, 1, 2]

  # Auto-picked once by install.sh from window_hours + a random minute;
  # leave blank on a fresh config. Clear both to re-roll a new time.
  start_hour: ""
  start_minute: ""

  # systemd RandomizedDelaySec (seconds) — an additional random delay
  # added on top of the scheduled time, for every timer-driven mode
  # (including hourly and calendar). Further smooths out clustering
  # beyond the once-per-host fixed start time above.
  jitter_seconds: 1800

# --- Retention (borg prune, run after every successful backup) -----------
retention:
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 6
  keep_yearly: 1

# --- Integrity check (borg check, run on its own schedule) ---------------
# A silently corrupted repo is only useful to discover *before* a real
# disaster recovery attempt needs it. This runs read-only (never
# --repair, which is a deliberate manual admin action) on its own timer
# separate from the backup schedule, since a full check is slower than a
# backup and shouldn't block it.
#
#   never    - no integrity_check timer is installed
#   weekly   - OnCalendar=weekly
#   monthly  - OnCalendar=monthly (default)
integrity_check:
  mode: monthly

# --- Run-tracking database (optional, off by default) ---------------------
# Records one row per backup/check run to a PostgreSQL database, for a
# future homelab-api/homelab-cli phase to read back out (that read side
# does not exist yet -- this only writes). install.sh asks about this
# interactively and, if enabled, creates the database/tables for you via
# install/schema.sql. Tables live in the service_backup schema so other
# homelab-* packages sharing this database later don't collide on names.
#
# password is stored here in plaintext, same as encryption.passphrase --
# keep this file mode 600 root:root.
database:
  enabled: false
  host: ""
  port: 5432
  dbname: homelab
  user: ""
  password: ""
