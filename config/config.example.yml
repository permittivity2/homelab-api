# Homelab API Configuration
# Copy this file to /etc/homelab/api/config.yml and edit with production values

# PostgreSQL Database Connection
database:
  host: YOUR_DB_HOST
  port: 5432
  name: mailserver
  user: homelab_api
  password: YOUR_DB_PASSWORD_HERE

# JWT Configuration
jwt:
  secret: YOUR_JWT_SECRET_KEY_HERE  # Change this to a strong random value in production
  algorithm: HS256
  expiry_seconds: 3600              # 1 hour
  refresh_expiry_seconds: 2592000   # 30 days

# Session/Cookie Configuration
session:
  secure: 0                          # Set to 1 when serving behind HTTPS proxy; 0 for local HTTP dev

# API Server Configuration
server:
  host: 0.0.0.0
  port: 3000
  workers: 4
  heartbeat_timeout: 600        # Seconds before Hypnotoad kills a blocked worker (default 50; increase for large uploads)

# Logging
logging:
  level: info
  format: json

# File Storage (Drive API) — the homelab-api-backend-processor package also
# needs its own copy of the storage.drive_path value (see its config example)
# since it connects to the same NFS mount independently.
storage:
  drive_path: /mnt/homelab-drive    # NFS mount for user Drive data
  max_file_size_mb: 10240             # Per-upload hard limit (10GB)
  max_concurrent_uploads: 4           # Advertised concurrency limit for clients

# Mail API (IMAP/SMTP) — see issue_tracking/015-dovecot-imap-api.md. Talks
# to Dovecot/Postfix as the caller's own JWT (via AUTHENTICATE OAUTHBEARER
# / AUTH OAUTHBEARER), so there is no separate mail password to configure
# here.
mail:
  imap:
    host: imap.mailmasker.org   # REQUIRED — no default; the app fails to start without this
    port: 993                  # REQUIRED — no default
    connect_timeout: 10   # seconds for the TCP+TLS+SASL handshake
    command_timeout: 15   # seconds per IMAP command round-trip
  smtp:
    host: mail.mailmasker.org   # REQUIRED — no default. Port 465 specifically (generic
    port: 465                  # REQUIRED — no default. implicit-TLS submission), NOT
                                 # 10465 (that listener is provisioned/rate-tuned for
                                 # Roundcube specifically — confirmed via HAProxy config).
    connect_timeout: 10   # seconds for the TCP+TLS+SASL handshake
    command_timeout: 15   # seconds per SMTP command round-trip (EHLO/AUTH/MAIL/RCPT)
    data_timeout: 30      # seconds for the DATA phase (larger due to attachment bodies)
  max_message_size_mb: 25 # rejects building a message beyond this, checked before
                           # assembling the MIME body — mirrors storage.max_file_size_mb
  pool:
    max_size: 200          # cached IMAP connections per worker process (not shared across workers)
    idle_timeout: 300      # seconds unused before a pooled connection is evicted
    max_lifetime: 3300     # seconds before a pooled connection is force-recycled even if busy
